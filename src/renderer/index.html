<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cubit Launcher</title>
    <style>
      /* Paint the shell background before React mounts, otherwise the first
         frame is white and the window "blinks" on every launch. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1316;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f6f8;
        }
      }
      #root {
        height: 100%;
      }
      /* Soft entry so the composed UI fades in instead of snapping. */
      #root > * {
        animation: boot-fade 260ms cubic-bezier(0.05, 0.7, 0.1, 1) both;
      }
      @keyframes boot-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app/main.tsx"></script>
  </body>
</html>
