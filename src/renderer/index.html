<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cubit Launcher</title>
    <style>
      /* Paint the shell background before React mounts, otherwise the first
         frame is white and the window "blinks" on every launch. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1316;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]),
        body:not([data-theme="dark"]) {
          background: #f4f6f8;
        }
      }
      #root {
        height: 100%;
      }
      /* Soft entry so the composed UI fades in instead of snapping. */
      #root > * {
        animation: boot-fade 260ms cubic-bezier(0.05, 0.7, 0.1, 1) both;
      }
      @keyframes boot-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
    <script>
      // Resolve the saved theme before the first paint: the OS may be light
      // while the app is dark, and that mismatch is what looked like a flash.
      (function () {
        try {
          var mode = localStorage.getItem('mc-launcher.theme-mode')
          var dark =
            mode === 'dark' ||
            ((!mode || mode === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var color = dark ? '#0f1316' : '#f4f6f8'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.background = color
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* keep the CSS defaults */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app/main.tsx"></script>
  </body>
</html>
